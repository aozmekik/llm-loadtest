# GoReleaser configuration for future releases: https://goreleaser.com
# Nothing has been released yet. CI runs "goreleaser check" on this file.
version: 2

project_name: llm-loadtest

before:
  hooks:
    - go mod verify
    - go test ./...

builds:
  - id: llm-loadtest
    main: ./cmd/llm-loadtest
    binary: llm-loadtest
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: llm-loadtest
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^chore"

release:
  draft: true
